name: Deploy

# Publishes the committed artifacts to GitHub Pages.
#
# Only the runtime files are uploaded. Publishing the repository root instead would also
# put src/, the build tooling and the workflow files on the public site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the built site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # What ships is the committed artifact, so re-assert here that it still matches src/.
      # This is the same guard the Check workflow runs; a page that disagrees with its source
      # can therefore never be published.
      - run: npm run check

      - name: Stage the runtime files
        run: |
          mkdir -p _site
          cp index.html styles.css script.js sitemap.xml robots.txt _site/
          cp -r assets _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
